# yaml-language-server: $schema=https://fgilde.github.io/QuickRun/quickrun.schema.json
name: Coworkee
description: "Self-hosted HR software for a single company. Postgres in Docker, the Prisma schema and demo data, then the Next.js dev server."

requires:
  - tool: node
    version: ">=20.0"
    install: https://nodejs.org
  - tool: docker
    install: https://docs.docker.com/get-docker/

env:
  # The credentials docker-compose.yml creates: POSTGRES_USER, _PASSWORD and _DB are all
  # "coworkee", and the container publishes 5433 on the host. Everything here reads process.env -
  # lib/db.ts, auth, and the seed scripts through dotenv - so no .env file is needed.
  DATABASE_URL: "postgresql://coworkee:coworkee@localhost:5433/coworkee?schema=public"
  AUTH_SECRET: "quickrun-local-dev-secret"
  # A demo instance, which is what someone opening this from a repository link wants: the example
  # company, and the four logins offered on /login. Without it the database comes up empty and the
  # first visit is the setup wizard rather than the application (app/page.tsx:39).
  DEMO: "1"

setup:
  - run: npm ci

tasks:
  - name: db
    # Waiting on the database rather than on the socket: Docker accepts connections on the
    # published port before Postgres has finished initialising a fresh volume, and the migration
    # would then run against something not ready to answer.
    run: docker compose up -d db && docker compose exec -T db sh -c "until pg_isready -U coworkee -d coworkee; do sleep 1; done"
    readyWhen: {port: 5433}

  - name: web
    # generate first: the Prisma client is not in the repository, and without it lib/db.ts imports
    # a module that does not exist - "Cannot find module '.prisma/client/default'" before anything
    # else can happen.
    #
    # migrate deploy, not migrate dev: the interactive variant has no console to ask in here, and
    # prisma/migrations is what it would apply anyway. seed-if-empty rather than seed, so starting
    # this a second time does not collide with the data from the first.
    run: npx prisma generate && npx prisma migrate deploy && npm run db:seed-if-empty && npm run dev
    dependsOn: [db]
    readyWhen: {http: "http://localhost:3000"}
    open: true

stop:
  - docker compose down
